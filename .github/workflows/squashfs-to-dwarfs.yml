on:
  workflow_dispatch: {}
jobs:
  squashfs-to-dwarfs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zram
      - uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          cleanup-profile: max
          swapfile-size: '0'
      - name: dependencies
        run: |
          sudo apt update
          sudo apt install -y oras btrfs-progs squashfs-tools
          mkdir dwarfs
          curl -L https://github.com/mhx/dwarfs/releases/download/v0.15.7/dwarfs-0.15.7-Linux-x86_64.tar.xz | tar -xJ -C dwarfs
          sudo cp dwarfs/dwarfs-0.15.7-Linux-x86_64/bin/mkdwarfs /usr/local/bin/mkdwarfs
          rm -rf dwarfs
      - name: pull
        run: |
          oras login ghcr.io --username=$GITHUB_ACTOR --password=${{ github.token }}
          oras pull ghcr.io/gmankab/lineage-squashfs:latest
          for part in part-*; do
            cat $part >> lineage.squashfs
            rm $part
          done
      - uses: ./.github/actions/btrfs
        env:
          dir: source
      - name: extract squashfs
        run: |
          sudo unsquashfs -f -no-progress -d source lineage.squashfs
          rm lineage.squashfs
      - name: dwarfs
        run: |
          mkdwarfs -i source -o lineage.dwarfs -l 4 -C zstd:level=9 -S 24 -B 4 --order=similarity --pack-metadata=all --progress=simple
          ls -lh lineage.dwarfs
