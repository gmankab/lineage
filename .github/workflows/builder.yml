on:
  workflow_dispatch: {}
  push: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zram
      - run: cargo build --release --bin squashfs-builder
      - uses: actions/upload-artifact@v7
        with:
          name: squashfs-builder
          path: target/release/squashfs-builder
