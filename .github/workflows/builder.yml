on:
  workflow_dispatch: {}
  push: {}

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zram
      - run: |
          cargo test --bin lineage-src-downloader
          cargo build --release --bin lineage-src-downloader
      - uses: actions/upload-artifact@v7
        with:
          name: lineage-src-downloader
          path: target/release/lineage-src-downloader
