on:
  workflow_dispatch: {}

jobs:
  lineage:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: lineage-ccache-spacewar-lineage-24
      cancel-in-progress: false
    env:
      USE_CCACHE: '1'
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/ccache
      CCACHE_MAXSIZE: 50GiB
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zram
      - name: dependencies
        run: |
          sudo apt update
          sudo apt install -y oras jq bc bison build-essential ccache curl erofs-utils flex g++-multilib git git-lfs gperf imagemagick protobuf-compiler python3-protobuf python-is-python3 lib32readline-dev lib32z1-dev libdw-dev libelf-dev libgnutls28-dev lz4 libsdl1.2-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool xsltproc xxd zip zlib1g-dev
          git lfs install
      - uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          skip-components: large-packages,android,java,rust,cached-tools
          cleanup-profile: max
          swapfile-size: '0'
      - name: pull squashfs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username="$GITHUB_ACTOR" --password-stdin
          oras pull ghcr.io/gmankab/lineage-squashfs:latest
          for part in part-*; do
            cat $part >> lineage.squashfs
            rm $part
          done
      - name: writable source overlay
        run: |
          mkdir source-ro source upper work
          sudo mount -t squashfs -o loop,ro $PWD/lineage.squashfs $PWD/source-ro
          sudo mount -t overlay overlay -o lowerdir=$PWD/source-ro,upperdir=$PWD/upper,workdir=$PWD/work $PWD/source
          sudo mkdir -p source/{device/nothing,kernel/nothing,hardware,vendor/nothing}
          sudo chown $USER source/{.,device/nothing,kernel/nothing,hardware,vendor/nothing}
      - name: spacewar sources
        working-directory: source
        run: |
          set -e
          mkdir -p device/nothing kernel/nothing hardware vendor/nothing
          git clone -q --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_device_nothing_Spacewar device/nothing/Spacewar
          git clone -q --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_kernel_nothing_sm7325 kernel/nothing/sm7325
          git clone -q --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_hardware_nothing hardware/nothing
          git clone -q --depth=1 -b lineage-24.0 https://github.com/TheMuppets/proprietary_vendor_nothing_Spacewar vendor/nothing/Spacewar
      - name: restore build caches
        run: |
          set -euo pipefail
          for cache in ccache build; do
            dir="$CCACHE_DIR"
            if [ "$cache" = build ]; then dir="$GITHUB_WORKSPACE/source/out"; fi
            mkdir -p "$dir"
            if oras manifest fetch "ghcr.io/gmankab/lineage-$cache:spacewar-lineage-24" > "$RUNNER_TEMP/$cache-manifest.json" 2> "$RUNNER_TEMP/$cache-pull.log"; then
              jq -er '.layers | sort_by(.annotations["org.opencontainers.image.title"])[] | .digest' "$RUNNER_TEMP/$cache-manifest.json" |
                while read -r digest; do
                  oras blob fetch "ghcr.io/gmankab/lineage-$cache@$digest" --output -
                done | tar -xf - -C "$dir"
            elif grep -Eqi 'MANIFEST_UNKNOWN|NAME_UNKNOWN|: not found$|404 Not Found' "$RUNNER_TEMP/$cache-pull.log"; then
              echo "No $cache image yet; starting empty"
            else
              cat "$RUNNER_TEMP/$cache-pull.log" >&2
              exit 1
            fi
          done
          ccache -M "$CCACHE_MAXSIZE"
      - name: build lineageos
        id: build
        timeout-minutes: 300
        working-directory: source
        run: |
          timeout --kill-after=30s 285m bash -c '
            set -eo pipefail
            source build/envsetup.sh
            breakfast Spacewar
            m bacon -j4
            ls -lh out/target/product/Spacewar/lineage-*.zip
          '
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          path: source/out/target/product/Spacewar/lineage-*.zip
      - name: save build caches
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        run: |
          set -euo pipefail
          ccache --cleanup
          ccache -s
          for cache in ccache build; do
            dir="$CCACHE_DIR"
            if [ "$cache" = build ]; then dir="$GITHUB_WORKSPACE/source/out"; fi
            chunks="$RUNNER_TEMP/$cache-oci"
            mkdir -p "$chunks"
            # Archive files and links only; do not remove directories still used by ccache.
            (cd "$dir"; find . \( -type f -o -type l \) -print0 | tar --null -T - --remove-files -cf -) | split -b 1G -d -a 3 - "$chunks/part-"
            (cd "$chunks"; oras push --artifact-type "application/vnd.lineage.$cache" --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" "ghcr.io/gmankab/lineage-$cache:spacewar-lineage-24" part-*)
            rm "$chunks"/part-*
          done
