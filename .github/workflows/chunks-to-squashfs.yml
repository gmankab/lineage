on:
  workflow_dispatch: {}
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  chunks-to-squashfs:
    runs-on: ubuntu-26.04
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/zram
      - name: deps
        run: |
          sudo apt update
          sudo apt install -y squashfs-tools oras
          export id=$(gh run list -w builder.yml -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download $id -n lineage-src-downloader
          chmod +x lineage-src-downloader
      - uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          cleanup-profile: max
          swapfile-size: '0'
      - name: squashfs
        run: |
          ./lineage-src-downloader
      - name: upload
        run: |
          ls -lh lineage.squashfs
          rm -rf workdir
          split -b 1G -d -a 3 lineage.squashfs part-
          oras login ghcr.io --username=$GITHUB_ACTOR --password=${{ github.token }}
          oras push --artifact-type application/vnd.lineage.squashfs ghcr.io/gmankab/lineage-squashfs:latest part-*
