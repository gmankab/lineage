[package]
name = "squashfs-builder"
version = "26.0.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Restartable LineageOS SquashFS builder"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[profile.release]
strip = true
lto = true
codegen-units = 1
